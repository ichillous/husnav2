<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check your email</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./husna.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Amiri&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b100f}
a{color:#c8efa4}a:hover{color:#dbf7c1}
</style>
</helmet>
<div class="auth">
<main class="auth-main">
<div class="auth-card stack g24">
<a class="brand" href="Main.dc.html" aria-label="Husna home"><svg viewBox="0 0 39 44" aria-hidden="true"><path d="M6 37V19C6 7 17 7 19.5 19V37M19.5 37V19C22 7 33 7 33 19V37M3 41h33"></path><circle cx="19.5" cy="6" r="2" fill="currentColor" stroke="none"></circle></svg>husna<i>.</i></a>
<div class="stack g12"><p class="eyebrow">Almost there</p><h1 class="d3">Check your <em>email.</em></h1>
<p class="mut">We sent a link to <span class="b ink">amina.farah@example.com</span>. Open it on this device to continue. The link works once and expires in 15 minutes.</p></div>
<a class="btn pri xl block" href="Emails.dc.html">Open my email</a>
<sc-if value="{{resent}}" hint-placeholder-val="{{false}}"><div class="note ok" role="status">Sent again. Give it a minute, and check your spam folder.</div></sc-if>
<hr class="hr">
<div class="stack g8">
<p class="mut">Nothing arrived? <button type="button" class="btn quiet sm" onClick="{{resend}}">Send it again</button></p>
<p class="mut">Wrong address? <a class="link" href="SignIn.dc.html">Go back and change it</a></p>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":600}}'>
class Component extends DCLogic {
  state = { resent: false };
  renderVals() {
    return { resent: this.state.resent, resend: () => this.setState({ resent: true }) };
  }
}
</script>
</body>
</html>
