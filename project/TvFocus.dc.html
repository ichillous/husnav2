<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV: focus layout</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./husna.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Amiri&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b100f}
a{color:#c8efa4}a:hover{color:#dbf7c1}
</style>
</helmet>
<div class="tv ">
<div class="tv-pad" style="flex-direction: column; gap: 0; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: flex-start"><div class="tv-org"><span class="tv-logo" aria-hidden="true">C</span><span>Crescent House Masjid</span></div>
<div class="tv-col" style="align-items: flex-end; gap: 4px"><div class="tv-clock" style="font-size: 88px"><span>{{clock}}</span><small style="font-size: 30px">{{ap}}</small></div><div style="font: 500 26px/1.3 'DM Sans', sans-serif; color: #b4bfb7">Thursday, October 8 · 27 Rabi’ al-Thani 1448</div></div></div>
<div class="tv-col" style="align-items: center; gap: 10px; text-align: center">
<p class="tv-eb">Next prayer</p>
<div style="display: flex; align-items: baseline; gap: 44px"><span style="font: 400 190px/.95 'Instrument Serif', serif; letter-spacing: -.03em">Maghrib</span><span lang="ar" dir="rtl" style="font: 400 150px/1 'Amiri', serif; color: #b4bfb7">المغرب</span></div>
<div class="tv-count" style="font-size: 250px; margin-top: 40px">{{count}}</div>
<div style="font-size: 40px; color: #b4bfb7">Adhan 7:04 PM · Iqamah 7:09 PM</div>
</div>
<div class="tv-strip"><div class="tv-cell past"><span class="k">Fajr</span><b>6:21</b><span class="i">Iqamah 6:45</span></div><div class="tv-cell past"><span class="k">Dhuhr</span><b>1:21</b><span class="i">Iqamah 1:45</span></div><div class="tv-cell past"><span class="k">Asr</span><b>4:32</b><span class="i">Iqamah 4:50</span></div><div class="tv-cell next"><span class="k">Maghrib</span><b>7:04</b><span class="i">Iqamah 7:09</span></div><div class="tv-cell "><span class="k">Isha</span><b>8:17</b><span class="i">Iqamah 8:30</span></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
state = { n: 0 };
  componentDidMount() { this._t = setInterval(() => this.setState({ n: this.state.n + 1 }), 1000); }
  componentWillUnmount() { clearInterval(this._t); }

  renderVals() {
    const f2 = (x) => String(x).padStart(2, '0');
    const clock = (s) => { const h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60; return ((h + 11) % 12 + 1) + ':' + f2(m); };
    const ap = (s) => (Math.floor(s / 3600) % 24 < 12 ? 'AM' : 'PM');
    const cd = (s) => { s = Math.max(0, s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return (h ? h + ':' + f2(m) : String(m)) + ':' + f2(x); };

    const start = 67332, adhan = 68640, n = this.state.n % (adhan - start);
    return { clock: clock(start + n), ap: ap(start + n), count: cd(adhan - start - n) };
  }
}
</script>
</body>
</html>
