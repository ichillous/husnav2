<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a new password</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./husna.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Amiri&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b100f}
a{color:#c8efa4}a:hover{color:#dbf7c1}
</style>
</helmet>
<div class="auth">
<main class="auth-main">
<div class="auth-card stack g24">
<a class="brand" href="Main.dc.html" aria-label="Husna home"><svg viewBox="0 0 39 44" aria-hidden="true"><path d="M6 37V19C6 7 17 7 19.5 19V37M19.5 37V19C22 7 33 7 33 19V37M3 41h33"></path><circle cx="19.5" cy="6" r="2" fill="currentColor" stroke="none"></circle></svg>husna<i>.</i></a>
<div class="stack g12"><p class="eyebrow">New password</p><h1 class="d3">Choose a new <em>password.</em></h1><p class="mut">For <span class="b ink">amina.farah@example.com</span></p></div>
<div class="stack g16">
<div class="field"><label class="label" for="rp-new">New password</label>
<div class="row g8 nowrap"><input class="input grow" id="rp-new" type="{{pwType}}" autoComplete="new-password" value="{{pw}}" onInput="{{onPw}}"><button type="button" class="btn" aria-pressed="{{showPressed}}" onClick="{{toggleShow}}">{{showLabel}}</button></div>
</div>
<ul class="stack g4 sm" aria-live="polite">
<li class="{{lenCls}}">{{lenMark}} At least 10 characters</li>
<li class="{{mixCls}}">{{mixMark}} A letter and a number</li>
</ul>
<div class="field"><label class="label" for="rp-again">Type it again</label><input class="input" id="rp-again" type="{{pwType}}" autoComplete="new-password"></div>
</div>
<a class="btn pri xl block" href="Workspaces.dc.html">Save password and sign in</a>
<p class="sm sub">Saving signs you out on every other device.</p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":620}}'>
class Component extends DCLogic {
  state = { pw: '', show: false };
  renderVals() {
    const s = this.state;
    const len = s.pw.length >= 10;
    const mix = /[A-Za-z]/.test(s.pw) && /[0-9]/.test(s.pw);
    return {
      pw: s.pw,
      onPw: (ev) => this.setState({ pw: ev.target.value }),
      pwType: s.show ? 'text' : 'password',
      showLabel: s.show ? 'Hide' : 'Show',
      showPressed: s.show ? 'true' : 'false',
      toggleShow: () => this.setState({ show: !s.show }),
      lenCls: len ? 'acc' : 'sub', lenMark: len ? '✓' : '○',
      mixCls: mix ? 'acc' : 'sub', mixMark: mix ? '✓' : '○'
    };
  }
}
</script>
</body>
</html>
